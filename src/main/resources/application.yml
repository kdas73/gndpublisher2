spring:
  application:
    name: gnd-publisher
  task:
    scheduling:
      pool:
        size: 4
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yml

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} [runId=%X{runId:-}] - %msg%n"

gnd:
  profile: ${GND_PROFILE:local}
  categories:
    options:
      - code: LAW_CHANGES
        name: Law Changes
        description: Changes in Greek laws and regulations
        publication-priority: 100
        enabled: true
      - code: HOLIDAYS
        name: Holidays
        description: Greek holidays
        publication-priority: 95
        enabled: true
      - code: ORGANIZATION_HOLIDAYS
        name: Organization Holidays
        description: How organizations in Greece work during holidays
        publication-priority: 92
        enabled: true
      - code: ECONOMY
        name: Economy
        description: economy of Greece
        publication-priority: 90
        enabled: true
      - code: STRIKES
        name: Strikes
        description: Strikes in Greece
        publication-priority: 88
        enabled: true
      - code: RUSSIA_GREECE_RELATIONS
        name: Russia Greece Relations
        description: Russian-Greek relations
        publication-priority: 84
        enabled: true
      - code: TOURISM
        name: Tourism
        description: Tourism in Greece
        publication-priority: 80
        enabled: true
      - code: CULTURE
        name: Culture
        description: Greece-related culture
        publication-priority: 75
        enabled: true
      - code: CULTURAL_EVENTS
        name: Cultural Events
        description: cultural events in Greece
        publication-priority: 74
        enabled: true
      - code: ENTERTAINMENT
        name: Entertainment
        description: Greek celebrities and entertainment
        publication-priority: 68
        enabled: true
      - code: CINEMA_THEATRE
        name: Cinema Theatre
        description: Cinema and theatre in Greece
        publication-priority: 67
        enabled: true
      - code: SPORTS
        name: Sports
        description: sports in Greece
        publication-priority: 65
        enabled: true
      - code: CUISINE
        name: Cuisine
        description: Greek cuisine
        publication-priority: 55
        enabled: true
      - code: HISTORY
        name: History
        description: Greek history
        publication-priority: 50
        enabled: true
      - code: HEALTHCARE
        name: Healthcare
        description: Healthcare in Greece
        publication-priority: 48
        enabled: true
      - code: RELIGION
        name: Religion
        description: Religion in Greece
        publication-priority: 47
        enabled: true
      - code: POLITICS
        name: Politics
        description: Politics in Greece
        publication-priority: 45
        enabled: true
      - code: INCIDENTS
        name: Incidents
        description: incidents in Greece
        publication-priority: 1
        enabled: true
    publishable-codes:
      - LAW_CHANGES
      - HOLIDAYS
      - ORGANIZATION_HOLIDAYS
      - ECONOMY
      - STRIKES
      - RUSSIA_GREECE_RELATIONS
      - TOURISM
      - CULTURE
      - CULTURAL_EVENTS
      - ENTERTAINMENT
      - CINEMA_THEATRE
      - SPORTS
      - CUISINE
      - HISTORY
      - HEALTHCARE
      - RELIGION
  publishing:
    target-languages:
      - ru
    default-max-items-per-source-per-run: 3
    source-quota-overrides: {}
    summary-max-characters: 600
    telegram-max-message-characters: 3500
    digest:
      enabled: true
      duplicate-threshold: 2
      channel-routing-key: important-news
  important-news-digest:
    enabled: true
    cron: "0 0 */6 * * *"
    duplicate-threshold: 2
    target-language: ru
    channel-code: important-news-ru
    lookback-window: 7d
  openai:
    api-key: ${OPENAI_API_KEY:}
    models:
      categorization: gpt-5.4-mini
      publication-content: gpt-5
    prompts:
      classification-version: classification-v1
      editorial-rules-version: editorial-rules-v1
      publication-content-version: publication-content-v1
    timeouts:
      connect: 5s
      read: 60s
    semantic-event-lookup-window: 3d
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    channels:
      - code: news-ru
        language: ru
        channel-id: ${TELEGRAM_NEWS_RU_CHANNEL_ID:${TELEGRAM_NEWS_EN_CHANNEL_ID:}}
        username: ${TELEGRAM_NEWS_RU_USERNAME:${TELEGRAM_NEWS_EN_USERNAME:}}
        message-url-template: ${TELEGRAM_NEWS_RU_MESSAGE_URL_TEMPLATE:${TELEGRAM_NEWS_EN_MESSAGE_URL_TEMPLATE:https://t.me/{username}/{messageId}}}
        enabled: true
      - code: important-news-ru
        language: ru
        channel-id: ${TELEGRAM_IMPORTANT_NEWS_RU_CHANNEL_ID:${TELEGRAM_IMPORTANT_NEWS_EN_CHANNEL_ID:}}
        username: ${TELEGRAM_IMPORTANT_NEWS_RU_USERNAME:${TELEGRAM_IMPORTANT_NEWS_EN_USERNAME:}}
        message-url-template: ${TELEGRAM_IMPORTANT_NEWS_RU_MESSAGE_URL_TEMPLATE:${TELEGRAM_IMPORTANT_NEWS_EN_MESSAGE_URL_TEMPLATE:https://t.me/{username}/{messageId}}}
        enabled: true
  scheduler:
    ingestion:
      enabled: true
      cron: "0 */3 * * * *"
    publication:
      enabled: true
      cron: "0 */1 * * * *"
    important-news-digest:
      enabled: true
      cron: "0 0 */6 * * *"
    cleanup:
      enabled: true
      cron: "0 0 3 * * *"
  cleanup:
    news-items-retention: 30d
    classification-runs-retention: 5d
    publications-retention: 30d
    digest-retention: 30d
