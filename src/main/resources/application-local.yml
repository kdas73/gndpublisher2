spring:
  config:
    import: optional:file:./application-secrets.local.yml
  datasource:
    url: jdbc:sqlite:./data/gnd-publisher-local.sqlite3
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    properties:
      hibernate:
        globally_quoted_identifiers: true
        type:
          preferred_instant_jdbc_type: BIGINT

gnd:
  profile: local
  cleanup:
    news-items-retention: 14d
    classification-runs-retention: 14d
