                  name: news_item_id
        - createIndex:
            tableName: classification_runs
            indexName: idx_classification_runs_created_at
            columns:
              - column:
                  name: created_at
        - createIndex:
            tableName: translations
            indexName: idx_translations_event_language
            columns:
              - column:
                  name: semantic_event_id
              - column:
                  name: target_language
        - createIndex:
            tableName: publications
            indexName: uk_publications_event_channel_language
            unique: true
            columns:
